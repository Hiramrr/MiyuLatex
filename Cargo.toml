[package]
name = "miyulatex"
version = "0.2.0"
edition = "2024"
description = "Editor de LaTeX, Markdown y código con visor de PDF e imágenes"

[[bin]]
name = "miyu"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland", "links"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
hayro = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
egui_extras = { version = "0.36", default-features = false, features = ["syntect", "image", "file"] }
egui_commonmark = { version = "0.25", features = ["better_syntax_highlighting"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
flate2 = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSRange", "NSString"] }

[features]
# La captura de eframe solo existe con glow.
screenshot = ["eframe/__screenshot", "eframe/glow"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

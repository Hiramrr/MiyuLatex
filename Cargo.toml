[package]
name = "miyulatex"
version = "0.2.0"
edition = "2024"
description = "Editor de LaTeX, Markdown y código con visor de PDF e imágenes"

[[bin]]
name = "miyu"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland", "links"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
hayro = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
egui_extras = { version = "0.36", default-features = false, features = ["syntect", "image", "file"] }
egui_commonmark = { version = "0.25", features = ["better_syntax_highlighting"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[features]
screenshot = ["eframe/__screenshot"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
